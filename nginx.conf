map $http_upgrade $conn_up { default upgrade; '' close; }
server {
  listen 8080 reuseport;
  tcp_nodelay on;
  proxy_buffering off;
  proxy_request_buffering off;
  # healthcheck goes through to the real panel, so a broken panel = failed deploy (not a silent bug)
  location = /health { access_log off; proxy_pass http://127.0.0.1:8000/dashboard/; }
  location = / { return 302 /dashboard/; }
  location /vless    { proxy_pass http://127.0.0.1:2001; include /etc/nginx/ws.inc; }
  location /vmess    { proxy_pass http://127.0.0.1:2002; include /etc/nginx/ws.inc; }
  location /trojan   { proxy_pass http://127.0.0.1:2003; include /etc/nginx/ws.inc; }
  location /panel-ws { proxy_pass http://127.0.0.1:2004; include /etc/nginx/ws.inc; }

  # Core config is read-only from the panel (protects the locked inbound)
  location = /api/core/config {
    if ($request_method != GET) { return 403; }
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;      # dashboard live logs (websocket)
    proxy_set_header Connection $conn_up;
    proxy_read_timeout 1h;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
